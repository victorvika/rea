<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
html,body{margin:0;padding:0;background:#131722;height:100%;overflow:hidden;font-family:system-ui}
#chart{height:68vh;width:100vw}
#bar{background:#1E222D;color:#D1D4DC;padding:8px;display:flex;gap:8px;align-items:center;overflow-x:auto}
#bar button{background:#2962FF;color:white;border:none;padding:6px 12px;border-radius:6px}
#bar button.active{background:#1E88E5}
#status{padding:8px;color:#9AA0B2;font-size:12px;background:#0F1116}
</style>
</head>
<body>
<div id="bar">
  <b style="color:#2962FF">TradingLite</b>
  <button onclick="setIntervalUI('1m')">1m</button>
  <button onclick="setIntervalUI('5m')">5m</button>
  <button class="active" onclick="setIntervalUI('1h')">1h</button>
  <button onclick="setIntervalUI('1d')">1d</button>
  <span id="price" style="margin-left:auto;color:#26A69A">BTCUSDT</span>
</div>
<div id="chart"></div>
<div id="status">Live chart via Binance public API - no ads, no subscription - inspired by TradingView</div>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{background:{color:'#131722'}, textColor:'#D1D4DC'},
  grid:{vertLines:{color:'#1E222D'}, horzLines:{color:'#1E222D'}},
  rightPriceScale:{borderColor:'#2A2E39'},
  timeScale:{borderColor:'#2A2E39', timeVisible:true}
});
const candle = chart.addCandlestickSeries({upColor:'#26A69A', downColor:'#EF5350', borderVisible:false, wickUpColor:'#26A69A', wickDownColor:'#EF5350'});
let currentInterval='1h', ws=null;

function mapBinanceKlines(data){
  return data.map(k=>({time:k[0]/1000, open:parseFloat(k[1]), high:parseFloat(k[2]), low:parseFloat(k[3]), close:parseFloat(k[4])}));
}

async function loadHistory(interval){
  try{
    document.getElementById('status').innerText='Loading '+interval+' ...';
    const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=150`);
    const data = await r.json();
    candle.setData(mapBinanceKlines(data));
    chart.timeScale().fitContent();
    document.getElementById('status').innerText='Live ✓ '+interval+' | 150 candles | Tap buttons to change interval';
    const last = data[data.length-1];
    if(last) document.getElementById('price').innerText='BTCUSDT '+parseFloat(last[4]).toFixed(2);
    connectWS(interval);
  }catch(e){
    document.getElementById('status').innerText='Offline demo data - internet blocked in preview, but APK la live varum: '+e;
    // fallback demo
    candle.setData([{time: Date.now()/1000-3600*4, open:35000, high:35200, low:34800, close:35100},{time:Date.now()/1000-3600*3, open:35100, high:35300, low:35000, close:35250},{time:Date.now()/1000-3600*2, open:35250, high:35500, low:35100, close:35400},{time:Date.now()/1000-3600, open:35400, high:35600, low:35300, close:35520}]);
  }
}
function connectWS(interval){
  if(ws) try{ws.close()}catch{}
  try{
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);
    ws.onmessage = (e)=>{
      const msg = JSON.parse(e.data);
      const k = msg.k;
      if(!k) return;
      const candlePoint = {time: k.t/1000, open:parseFloat(k.o), high:parseFloat(k.h), low:parseFloat(k.l), close:parseFloat(k.c)};
      candle.update(candlePoint);
      document.getElementById('price').innerText='BTCUSDT '+parseFloat(k.c).toFixed(2)+' '+(k.x? '✓':'...');
    };
  }catch(e){ console.log('ws fail',e)}
}
function setIntervalUI(iv){
  currentInterval=iv;
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('active', b.innerText===iv));
  loadHistory(iv);
}
loadHistory('1h');
</script>
</body>
</html>
