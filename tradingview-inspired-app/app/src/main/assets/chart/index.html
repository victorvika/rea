<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { margin:0; padding:0; background:#131722; height:100%; }
    #chart { height:100vh; width:100vw; }
  </style>
</head>
<body>
<div id="chart"></div>
<script>
  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color:'#131722' }, textColor:'#D1D4DC' },
    grid: { vertLines:{color:'#1E222D'}, horzLines:{color:'#1E222D'} },
    rightPriceScale: { borderColor:'#2A2E39' },
    timeScale: { borderColor:'#2A2E39' }
  });
  const candle = chart.addCandlestickSeries();
  // Demo data - replace with fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h")
  const demo = [
    {time: 1700000000, open: 35000, high:35200, low:34800, close:35100},
    {time: 1700003600, open: 35100, high:35300, low:35000, close:35250},
    {time: 1700007200, open: 35250, high:35500, low:35100, close:35400},
    {time: 1700010800, open: 35400, high:35600, low:35300, close:35350},
  ];
  candle.setData(demo);

  // Android bridge: call from Kotlin -> window.updateChart(json)
  window.updateChart = (jsonStr) => {
    try { candle.setData(JSON.parse(jsonStr)); } catch(e){ console.error(e); }
  };
  window.addEventListener('resize', ()=> chart.timeScale().fitContent());
  chart.timeScale().fitContent();
</script>
</body>
</html>
