name: Build TradingLite APK

on:
  push:
    branches: ["arena/5cd68b3c-rea"]
    paths: ["tradingview-inspired-app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: tradingview-inspired-app
        run: |
          chmod +x gradlew || echo "using gradle wrapper fallback"
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingLite-LiveChart-APK
          path: tradingview-inspired-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
